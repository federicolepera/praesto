apiVersion: apps/v1
kind: Deployment
metadata:
  name: praesto-csi-webhook-test
  namespace: default
  labels:
    app: praesto-csi-webhook-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praesto-csi-webhook-test
  template:
    metadata:
      labels:
        app: praesto-csi-webhook-test
      annotations:
        praesto.io/model-cache: tinyllama-test
        praesto.io/model-mount-path: /model
        praesto.io/target-container: shell
    spec:
      containers:
        - name: shell
          image: ubuntu:24.04
          command: ["bash", "-lc", "sleep infinity"]
