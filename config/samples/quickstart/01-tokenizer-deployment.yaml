apiVersion: apps/v1
kind: Deployment
metadata:
  name: praesto-tokenizer-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praesto-tokenizer-test
  template:
    metadata:
      labels:
        app: praesto-tokenizer-test
      annotations:
        praesto.io/model-cache: tinyllama-test
        praesto.io/model-mount-path: /models
    spec:
      containers:
      - name: tokenizer-test
        image: python:3.11-slim
        command:
        - sh
        - -c
        - |
          set -eux

          ls -la /models

          pip install --no-cache-dir transformers sentencepiece

          python - <<'PY'
          from transformers import AutoTokenizer

          tokenizer = AutoTokenizer.from_pretrained("/models", local_files_only=True)
          tokens = tokenizer("Hello from Praesto")

          print("Tokenizer loaded from /models")
          print(tokens)
          PY

          sleep 3600
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
