# This rule is not used by the project praesto itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the praesto.praesto.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: praesto
    app.kubernetes.io/managed-by: kustomize
  name: modelcachenode-editor-role
rules:
- apiGroups:
  - praesto.praesto.io
  resources:
  - modelcachenodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - praesto.praesto.io
  resources:
  - modelcachenodes/status
  verbs:
  - get
