name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE_NAME: ${{ github.repository }}
  DOWNLOADER_IMAGE_NAME: ${{ github.repository }}/downloader
  CSI_NODE_DRIVER_IMAGE_NAME: ${{ github.repository }}/csi-node-driver

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract operator Docker metadata
        id: operator-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push operator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.operator-meta.outputs.tags }}
          labels: ${{ steps.operator-meta.outputs.labels }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

      - name: Extract downloader Docker metadata
        id: downloader-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOWNLOADER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push downloader image
        uses: docker/build-push-action@v5
        with:
          context: ./internal/downloader
          file: ./internal/downloader/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.downloader-meta.outputs.tags }}
          labels: ${{ steps.downloader-meta.outputs.labels }}
          cache-from: type=gha,scope=downloader
          cache-to: type=gha,mode=max,scope=downloader

      - name: Extract CSI node driver Docker metadata
        id: csi-node-driver-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CSI_NODE_DRIVER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push CSI node driver image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cmd/csi-node-driver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.csi-node-driver-meta.outputs.tags }}
          labels: ${{ steps.csi-node-driver-meta.outputs.labels }}
          cache-from: type=gha,scope=csi-node-driver
          cache-to: type=gha,mode=max,scope=csi-node-driver
