name: Build and Push Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  CHART_DIR: charts/praesto
  CHART_REPOSITORY: ${{ github.repository }}/charts

jobs:
  build-and-push-helm:
    name: Build and Push Helm Chart
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Read chart metadata
        id: chart
        run: |
          CHART_NAME="$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("name")' "${CHART_DIR}/Chart.yaml")"
          CHART_VERSION="$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("version")' "${CHART_DIR}/Chart.yaml")"
          APP_VERSION="$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("appVersion")' "${CHART_DIR}/Chart.yaml")"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${CHART_VERSION}-main.${GITHUB_RUN_NUMBER}"
          fi

          echo "name=${CHART_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Lint chart
        run: helm lint "${CHART_DIR}"

      - name: Render chart
        run: helm template "${{ steps.chart.outputs.name }}" "${CHART_DIR}" --include-crds >/dev/null

      - name: Package chart
        run: |
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${{ steps.chart.outputs.version }}" \
            --app-version "${{ steps.chart.outputs.app_version }}"

      - name: Push chart to GHCR
        run: |
          helm push "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.CHART_REPOSITORY }}"
