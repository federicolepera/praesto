{{- if and .Values.rbac.create .Values.rbac.aggregateRoles.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-modelcache-admin-role" (include "praesto.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "praesto.labels" . | nindent 4 }}
rules:
- apiGroups: ["praesto.praesto.io"]
  resources: ["modelcaches"]
  verbs: ["*"]
- apiGroups: ["praesto.praesto.io"]
  resources: ["modelcaches/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-modelcache-editor-role" (include "praesto.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "praesto.labels" . | nindent 4 }}
rules:
- apiGroups: ["praesto.praesto.io"]
  resources: ["modelcaches"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["praesto.praesto.io"]
  resources: ["modelcaches/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-modelcache-viewer-role" (include "praesto.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "praesto.labels" . | nindent 4 }}
rules:
- apiGroups: ["praesto.praesto.io"]
  resources: ["modelcaches"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["praesto.praesto.io"]
  resources: ["modelcaches/status"]
  verbs: ["get"]
{{- end }}
